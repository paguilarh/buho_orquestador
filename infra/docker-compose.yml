x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Monterrey
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__BASE_URL: https://${AIRFLOW_DOMAIN}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST}
    AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT}
    AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM}
    AIRFLOW__SMTP__SMTP_STARTTLS: "true"
  volumes:
    - ../dags:/opt/airflow/dags
    - ../plugins:/opt/airflow/plugins
    - ../include:/opt/airflow/include
    - ../tests:/opt/airflow/tests
    - airflow-logs:/opt/airflow/logs
    - /opt/airflow/secrets:/opt/airflow/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Buho \
          --role Admin --email "${SMTP_MAIL_FROM}" || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    expose:
      - "8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-test:
    <<: *airflow-common
    entrypoint: ""
    command: ["pytest", "tests/", "-v"]
    environment:
      <<: *airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-test.db
      PYTHONPATH: /opt/airflow/plugins
    depends_on: []
    profiles: ["test"]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      AIRFLOW_DOMAIN: ${AIRFLOW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - airflow-webserver
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
  caddy-data:
